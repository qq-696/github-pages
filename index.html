<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>商品展示</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --panel: #f2f2f2;
      --card: #f9f9f9;
      --text: #222;
      --muted: #666;
      --line: #d9d9d9;
      --accent: #1f1f1f;
      --button: #111827;
      --button-text: #fff;
      --shadow: rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .browser {
      width: 100%;
      max-width: 1440px;
      min-height: 800px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.05);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 58px;
      padding: 0 14px 0 12px;
      background: #f3f3f3;
      border-bottom: 1px solid var(--line);
    }

    .left-tools,
    .right-tools {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 180px;
    }

    .right-tools {
      justify-content: flex-end;
    }

    .circle {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.25);
      background: #f3f3f3;
      display: inline-block;
    }

    .circle.red { background: #ee5f57; }
    .circle.yellow { background: #f6bf4f; }
    .circle.green { background: #62c554; }

    .address {
      flex: 1;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #f8f8f8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a4a4a;
      font-size: 13px;
      letter-spacing: 0.2px;
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.02);
    }

    .page {
      background: #f7f7f7;
      min-height: 740px;
      padding: 20px 0 0 0;
    }

    .content {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      gap: 28px;
      align-items: flex-start;
    }

    .product-list {
      width: 380px;
      min-width: 300px;
    }

    .product {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px var(--shadow);
      margin-bottom: 18px;
    }

    .product-image {
      display: block;
      width: 100%;
      height: 320px;
      object-fit: cover;
      background: #ddd;
    }

    .product-info {
      padding: 14px 12px 16px;
    }

    .product-info h3 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 700;
      color: #111;
    }

    .product-info p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .link {
      display: inline-block;
      margin-top: 12px;
      color: #000;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      border-bottom: 1px solid rgba(0,0,0,0.7);
      padding-bottom: 1px;
    }

    .spacer {
      flex: 1;
      min-height: 300px;
      border-radius: 12px;
      background: rgba(0,0,0,0.01);
    }

    @media (max-width: 900px) {
      .content {
        flex-direction: column;
        align-items: center;
      }

      .product-list {
        width: min(100%, 420px);
      }

      .spacer {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="browser">
    <div class="toolbar">
      <div class="left-tools">
        <span class="circle red"></span>
        <span class="circle yellow"></span>
        <span class="circle green"></span>
      </div>

      <div class="address">https://qq-696.github.io/github-pages/#购物车</div>

      <div class="right-tools">
        <span style="font-size: 18px; color: #666;">⌕</span>
        <span style="font-size: 18px; color: #666;">☆</span>
        <span style="font-size: 18px; color: #666;">☰</span>
      </div>
    </div>

    <div class="page">
      <div class="content">
        <div class="product-list">
          <div class="product">
            <img class="product-image" src="壮族头饰冰箱贴.png" alt="壮族头饰冰箱贴" />
            <div class="product-info">
              <h3>苗族头饰冰箱贴</h3>
              <p>苗族头饰冰箱贴，采用传统元素与现代手工工艺结合，带来独特的民族风情。适合装饰冰箱，也可作为收藏礼品。</p>
              <a href="#" class="link">了解更多</a>
            </div>
          </div>

          <div class="product">
            <img class="product-image" src="书签.png" alt="瑶族刺绣书签" />
            <div class="product-info">
              <h3>瑶族刺绣书签</h3>
              <p>采用瑶族传统刺绣样式，手工精巧，兼具文化收藏价值和实用感，适合赠送亲友或自用收藏。</p>
              <a href="#" class="link">了解更多</a>
            </div>
          </div>
        </div>

        <div class="spacer"></div>
      </div>
    </div>
  </div>
</body>
</html>
